<!DOCTYPE html>
<html>
<head>
  <title>Breakout</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #151225; color: #fff; font-family: Arial, sans-serif; }
    .wrap { text-align: center; }
    canvas { background: #080a12; border: 4px solid #b72be8; border-radius: 12px; }
    button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: #b72be8; color: #fff; font-weight: 700; cursor: pointer; }
    p { color: #d8c7ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Breakout</h2>
    <p>Move mouse or use Arrow Left / Arrow Right</p>
    <h3>Score: <span id="score">0</span></h3>
    <canvas id="game" width="760" height="480" tabindex="0"></canvas>
    <br>
    <button onclick="restart()">Restart</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    let paddle, ball, bricks, score, keys, gameOver, won;

    function restart() {
      paddle = { x: canvas.width / 2 - 55, y: canvas.height - 35, w: 110, h: 12, speed: 8 };
      ball = { x: canvas.width / 2, y: canvas.height - 60, vx: 4, vy: -4, r: 8 };
      score = 0;
      keys = {};
      gameOver = false;
      won = false;
      scoreEl.textContent = score;

      bricks = [];

      for (let row = 0; row < 5; row += 1) {
        for (let col = 0; col < 10; col += 1) {
          bricks.push({
            x: 45 + col * 68,
            y: 55 + row * 30,
            w: 58,
            h: 18,
            alive: true,
            color: ["#c026d3", "#a855f7", "#2563eb", "#22c55e", "#f59e0b"][row]
          });
        }
      }

      canvas.focus();
    }

    function draw() {
      ctx.fillStyle = "#080a12";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      bricks.forEach((brick) => {
        if (!brick.alive) return;

        ctx.fillStyle = brick.color;
        ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
      });

      ctx.fillStyle = "#fff";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      if (gameOver || won) {
        ctx.fillStyle = "#fff";
        ctx.font = "30px Arial";
        ctx.textAlign = "center";
        ctx.fillText(won ? "You Win" : "Game Over", canvas.width / 2, canvas.height / 2);
      }
    }

    function update() {
      if (gameOver || won) {
        draw();
        requestAnimationFrame(update);
        return;
      }

      if (keys.ArrowLeft) paddle.x -= paddle.speed;
      if (keys.ArrowRight) paddle.x += paddle.speed;

      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x < ball.r || ball.x > canvas.width - ball.r) {
        ball.vx *= -1;
      }

      if (ball.y < ball.r) {
        ball.vy *= -1;
      }

      if (
        ball.y + ball.r > paddle.y &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.w
      ) {
        ball.vy = -Math.abs(ball.vy);
      }

      bricks.forEach((brick) => {
        if (!brick.alive) return;

        if (
          ball.x > brick.x &&
          ball.x < brick.x + brick.w &&
          ball.y - ball.r < brick.y + brick.h &&
          ball.y + ball.r > brick.y
        ) {
          brick.alive = false;
          ball.vy *= -1;
          score += 1;
          scoreEl.textContent = score;
        }
      });

      if (ball.y > canvas.height) {
        gameOver = true;
      }

      if (bricks.every((brick) => !brick.alive)) {
        won = true;
      }

      draw();
      requestAnimationFrame(update);
    }

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      paddle.x = e.clientX - rect.left - paddle.w / 2;
    });

    document.addEventListener("keydown", (e) => keys[e.key] = true);
    document.addEventListener("keyup", (e) => keys[e.key] = false);
    canvas.addEventListener("click", () => canvas.focus());

    restart();
    update();
  </script>
</body>
</html>
