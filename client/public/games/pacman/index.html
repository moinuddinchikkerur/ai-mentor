<!DOCTYPE html>
<html>
<head>
  <title>Pacman</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #151225; color: #fff; font-family: Arial, sans-serif; }
    .wrap { text-align: center; }
    canvas { background: #050816; border: 4px solid #b72be8; border-radius: 12px; }
    button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: #b72be8; color: #fff; font-weight: 700; cursor: pointer; }
    p { color: #d8c7ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Pacman</h2>
    <p>Use Arrow keys or WASD. Collect dots and avoid ghosts.</p>
    <h3>Score: <span id="score">0</span></h3>
    <canvas id="game" width="520" height="420" tabindex="0"></canvas>
    <br>
    <button onclick="restart()">Restart</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const tile = 20;

    const map = [
      "##########################",
      "#............##..........#",
      "#.####.#####.##.#####.##.#",
      "#........................#",
      "#.####.##.########.##.####",
      "#......##....##....##....#",
      "######.##### ## #####.####",
      "#............  ..........#",
      "#.####.##.########.##.####",
      "#......##....##....##....#",
      "#.##########.##.########.#",
      "#........................#",
      "##########################"
    ];

    let pacman, ghosts, dots, score, dir, nextDir, gameOver;

    function buildDots() {
      dots = [];

      map.forEach((row, y) => {
        row.split("").forEach((cell, x) => {
          if (cell === ".") {
            dots.push({ x, y });
          }
        });
      });
    }

    function isWall(x, y) {
      const col = Math.floor(x / tile);
      const row = Math.floor(y / tile);
      return map[row]?.[col] === "#";
    }

    function canMove(entity, direction) {
      const nx = entity.x + direction.x * entity.speed;
      const ny = entity.y + direction.y * entity.speed;
      return !isWall(nx + 9, ny + 9) && !isWall(nx + 11, ny + 11);
    }

    function restart() {
      pacman = { x: tile * 1.5, y: tile * 1.5, speed: 2 };
      ghosts = [
        { x: tile * 20, y: tile * 3, speed: 1.4, color: "#ef4444", dir: { x: -1, y: 0 } },
        { x: tile * 14, y: tile * 9, speed: 1.2, color: "#22c55e", dir: { x: 1, y: 0 } }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      scoreEl.textContent = score;
      buildDots();
      canvas.focus();
    }

    function draw() {
      ctx.fillStyle = "#050816";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      map.forEach((row, y) => {
        row.split("").forEach((cell, x) => {
          if (cell === "#") {
            ctx.fillStyle = "#312e81";
            ctx.fillRect(x * tile, y * tile, tile, tile);
          }
        });
      });

      ctx.fillStyle = "#facc15";
      dots.forEach((dot) => {
        ctx.beginPath();
        ctx.arc(dot.x * tile + tile / 2, dot.y * tile + tile / 2, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = "#fde047";
      ctx.beginPath();
      ctx.arc(pacman.x, pacman.y, 10, 0.25 * Math.PI, 1.75 * Math.PI);
      ctx.lineTo(pacman.x, pacman.y);
      ctx.fill();

      ghosts.forEach((ghost) => {
        ctx.fillStyle = ghost.color;
        ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, 10, 0, Math.PI * 2);
        ctx.fill();
      });

      if (gameOver) {
        ctx.fillStyle = "#fff";
        ctx.font = "30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);
      }

      if (dots.length === 0) {
        ctx.fillStyle = "#fff";
        ctx.font = "30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("You Win", canvas.width / 2, canvas.height / 2);
      }
    }

    function update() {
      if (gameOver || dots.length === 0) {
        draw();
        requestAnimationFrame(update);
        return;
      }

      if (canMove(pacman, nextDir)) {
        dir = nextDir;
      }

      if (canMove(pacman, dir)) {
        pacman.x += dir.x * pacman.speed;
        pacman.y += dir.y * pacman.speed;
      }

      dots = dots.filter((dot) => {
        const dx = pacman.x - (dot.x * tile + tile / 2);
        const dy = pacman.y - (dot.y * tile + tile / 2);

        if (Math.hypot(dx, dy) < 12) {
          score += 1;
          scoreEl.textContent = score;
          return false;
        }

        return true;
      });

      ghosts.forEach((ghost) => {
        if (!canMove(ghost, ghost.dir) || Math.random() < 0.02) {
          const dirs = [
            { x: 1, y: 0 },
            { x: -1, y: 0 },
            { x: 0, y: 1 },
            { x: 0, y: -1 }
          ];

          ghost.dir = dirs[Math.floor(Math.random() * dirs.length)];
        }

        if (canMove(ghost, ghost.dir)) {
          ghost.x += ghost.dir.x * ghost.speed;
          ghost.y += ghost.dir.y * ghost.speed;
        }

        if (Math.hypot(pacman.x - ghost.x, pacman.y - ghost.y) < 18) {
          gameOver = true;
        }
      });

      draw();
      requestAnimationFrame(update);
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if (key === "arrowup" || key === "w") nextDir = { x: 0, y: -1 };
      if (key === "arrowdown" || key === "s") nextDir = { x: 0, y: 1 };
      if (key === "arrowleft" || key === "a") nextDir = { x: -1, y: 0 };
      if (key === "arrowright" || key === "d") nextDir = { x: 1, y: 0 };
    });

    canvas.addEventListener("click", () => canvas.focus());
    restart();
    update();
  </script>
</body>
</html>
