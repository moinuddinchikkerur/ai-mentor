

 <!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #151225; color: #fff; font-family: Arial, sans-serif; }
    .wrap { text-align: center; }
    canvas { background: #080a12; border: 4px solid #b72be8; border-radius: 12px; }
    button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: #b72be8; color: #fff; font-weight: 700; cursor: pointer; }
    p { color: #d8c7ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Snake Game</h2>
    <p>Use Arrow keys or WASD</p>
    <h3>Score: <span id="score">0</span></h3>
    <canvas id="game" width="420" height="420" tabindex="0"></canvas>
    <br>
    <button onclick="restart()">Restart</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const size = 20;
    let snake, food, dx, dy, score, gameOver;

    function restart() {
      snake = [{ x: 200, y: 200 }];
      food = randomFood();
      dx = size;
      dy = 0;
      score = 0;
      gameOver = false;
      scoreEl.textContent = score;
      canvas.focus();
    }

    function randomFood() {
      return {
        x: Math.floor(Math.random() * (canvas.width / size)) * size,
        y: Math.floor(Math.random() * (canvas.height / size)) * size
      };
    }

    function draw() {
      ctx.fillStyle = "#080a12";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(food.x, food.y, size, size);

      ctx.fillStyle = "#22c55e";
      snake.forEach((part) => ctx.fillRect(part.x, part.y, size - 2, size - 2));

      if (gameOver) {
        ctx.fillStyle = "#fff";
        ctx.font = "30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);
      }
    }

    function update() {
      if (gameOver) return draw();

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (
        head.x < 0 || head.y < 0 ||
        head.x >= canvas.width || head.y >= canvas.height ||
        snake.some((part) => part.x === head.x && part.y === head.y)
      ) {
        gameOver = true;
        return draw();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        food = randomFood();
      } else {
        snake.pop();
      }

      draw();
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if ((key === "arrowup" || key === "w") && dy === 0) {
        dx = 0; dy = -size;
      }
      if ((key === "arrowdown" || key === "s") && dy === 0) {
        dx = 0; dy = size;
      }
      if ((key === "arrowleft" || key === "a") && dx === 0) {
        dx = -size; dy = 0;
      }
      if ((key === "arrowright" || key === "d") && dx === 0) {
        dx = size; dy = 0;
      }
    });

    canvas.addEventListener("click", () => canvas.focus());
    restart();
    setInterval(update, 120);
  </script>
</body>
</html>
