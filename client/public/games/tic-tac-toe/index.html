<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .wrap {
      text-align: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      gap: 10px;
      justify-content: center;
      margin: 18px auto;
    }

    .cell {
      width: 110px;
      height: 110px;
      border: 2px solid #c084fc;
      border-radius: 16px;
      background: #1f2937;
      color: white;
      font-size: 52px;
      font-weight: 800;
      cursor: pointer;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: #b72be8;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    #status {
      color: #ddd6fe;
      font-weight: 700;
      min-height: 24px;
    }

    @media (max-width: 420px) {
      .board {
        grid-template-columns: repeat(3, 86px);
      }

      .cell {
        width: 86px;
        height: 86px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tic Tac Toe</h1>
    <p id="status">Your turn</p>
    <div id="board" class="board"></div>
    <button onclick="resetGame()">Restart</button>
  </div>

  <script>
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");

    let board = Array(9).fill("");
    let gameOver = false;

    const wins = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function winner() {
      for (const [a, b, c] of wins) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }

      if (board.every(Boolean)) return "draw";

      return "";
    }

    function computerMove() {
      if (gameOver) return;

      const empty = board
        .map((value, index) => value ? null : index)
        .filter((value) => value !== null);

      if (!empty.length) return;

      const move = empty[Math.floor(Math.random() * empty.length)];
      board[move] = "O";

      checkGame();
      render();
    }

    function play(index) {
      if (gameOver || board[index]) return;

      board[index] = "X";
      checkGame();
      render();

      if (!gameOver) {
        setTimeout(computerMove, 300);
      }
    }

    function checkGame() {
      const result = winner();

      if (result === "X") {
        statusEl.textContent = "You win.";
        gameOver = true;
      } else if (result === "O") {
        statusEl.textContent = "Computer wins.";
        gameOver = true;
      } else if (result === "draw") {
        statusEl.textContent = "Draw.";
        gameOver = true;
      } else {
        statusEl.textContent = "Your turn";
      }
    }

    function resetGame() {
      board = Array(9).fill("");
      gameOver = false;
      statusEl.textContent = "Your turn";
      render();
    }

    function render() {
      boardEl.innerHTML = "";

      board.forEach((value, index) => {
        const cell = document.createElement("button");
        cell.className = "cell";
        cell.textContent = value;
        cell.onclick = () => play(index);
        boardEl.appendChild(cell);
      });
    }

    render();
  </script>
</body>
</html>
